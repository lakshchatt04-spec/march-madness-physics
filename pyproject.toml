[project]
name = "marchmadness-engine"
version = "0.1.0"
description = "Data pipeline for a thermodynamics-inspired March Madness simulation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.5", "mypy>=1.10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]
include = ["src/**", "tests/**", "tools/**"]
extend-exclude = ["__pycache__", "*.pyc"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "ARG"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG002"]

[tool.mypy]
strict = true
packages = ["src"]
